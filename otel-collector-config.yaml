receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # masks the trailing item id so log_dedup sees identical messages
  transform/mask_item_id:
    log_statements:
      - 'replace_pattern(log.body, ": [^ ]+$", ": *")'
  log_dedup:
    interval: 10s
    log_count_attribute: dedup_count
    conditions:
      - 'IsMatch(log.body, "^(Starting|Finished) processing item: \\*$")'
      - 'IsMatch(log.body, "^(Reading item from Kafka: \\*|Kafka read completed)$")'
      - 'IsMatch(log.body, "^(Writing item to database|Database write completed): \\*$")'
    exclude_fields:
      - attributes.item_id
  # tags collector span metrics so are distinct from post-sampling ones generated via tempo
  attributes/pre_sampling:
    actions:
      - key: sampling_stage
        value: pre
        action: insert
  # goal is to retain 20% overall but keep lower-throughput routes more visible
  adaptive_tail_sampling:
    rules:
      - name: adaptive-by-route
        sampler:
          type: adaptive_percentage
          goal_percentage: 20
          fingerprint_attributes:
            - root.attributes["http.route"]

connectors:
  # counts every span before sampling, same metric names as tempo (traces_spanmetrics_*)
  span_metrics:
    namespace: traces.spanmetrics
  forward: {}

exporters:
  otlp:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers:
        - otlp
      exporters:
        - span_metrics
        - forward
    traces/sampled:
      receivers:
        - forward
      processors:
        - adaptive_tail_sampling
        - batch
      exporters:
        - otlp
    metrics:
      receivers:
        - span_metrics
      processors:
        - attributes/pre_sampling
        - batch
      exporters:
        - otlp
    logs:
      receivers:
        - otlp
      processors:
        - transform/mask_item_id
        - log_dedup
        - batch
      exporters:
        - otlp