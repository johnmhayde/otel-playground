receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  log_dedup:
    interval: 10s
    log_count_attribute: dedup_count
    # only dedupe processing logs
    # conditions:
      # - 'IsMatch(log.body, ".*processing item:.*")'

exporters:
  otlp:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp
    logs:
      receivers:
        - otlp
      processors:
        - log_dedup
        - batch
      exporters:
        - otlp